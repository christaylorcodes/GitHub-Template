---
####################################################
#          ModuleBuilder Configuration             #
####################################################

SourcePath: source
# Folders under source/ copied as-is into the built module (en-US holds about_* help)
CopyPaths:
  - en-US
Encoding: UTF8
VersionedOutputDirectory: true

####################################################
#              Pipeline Configuration              #
####################################################

BuildWorkflow:
  '.':
    - build
    - test

  build:
    - Clean
    - Assert_RequiredModule_Versions
    - Build_ModuleOutput_ModuleBuilder
    - Create_changelog_release_output

  pack:
    - build
    - package_module_nupkg

  test:
    - Assert_RequiredModule_Versions
    - Pester_Tests_Stop_On_Fail

  docs:
    - Clean
    - Build_Module_ModuleBuilder
    - Update_markdown_help_source
    - Postprocess_PlatyPS_docs
    - Generate_MAML_from_markdown_help_source
    - Assert_MAML_help_generated

####################################################
#       Sampler Pipeline Configuration             #
####################################################

Sampler:
  DefaultOutputDirectory: 'output'

ModuleBuildTasks:
  Sampler:
    - '*.build.Sampler.ib.tasks'
  Sampler.GitHubTasks:
    - '*.ib.tasks'
  ModuleBuilder:
    - '*.build.ModuleBuilder.ib.tasks'

TaskHeader: |
  param($Path)
  ""
  "=" * 79
  Write-Build Cyan "`t`t`t$($Task.Name.replace("_"," ").ToUpper())"
  Write-Build DarkGray  "$(Get-BuildSynopsis $Task)"
  "-" * 79
  Write-Build DarkGray "  $Path"
  Write-Build DarkGray "  $($Task.InvocationInfo.ScriptName):$($Task.InvocationInfo.ScriptLineNumber)"
  ""

####################################################
#       PESTER Configuration                       #
####################################################

Pester:
  Configuration:
    Run:
      Path:
        - Tests
      ExcludePath:
    Filter:
      Tag:
      ExcludeTag:
        - Live
        - Integration
    Output:
      Verbosity:
    CodeCoverage:
      Path:
      OutputFormat:
      CoveragePercentTarget: 0
      OutputPath: JaCoCo_coverage.xml  # relative to output/testResults
      OutputEncoding: ascii
      ExcludeTests:
    TestResult:
      OutputFormat: NUnitXml
      OutputPath:
      OutputEncoding:
      TestSuiteName:
  ExcludeFromCodeCoverage:

####################################################
#       PlatyPS / Documentation Configuration      #
####################################################

# Markdown help source. Must contain ONLY culture folders (en-US, ...);
# Sampler treats every subfolder as a locale.
HelpSourceFolder: docs/help
HelpCultureInfo: en-US  # informational; Sampler's task uses the folder names
CopyHelpMamlToBuiltModuleBase: true

####################################################
#       PSScriptAnalyzer Configuration            #
####################################################

PSScriptAnalyzer:
  Script: source
  Settings: .PSScriptAnalyzerSettings.psd1
  ExcludeRule:
  IncludeRule:

ChangelogConfig:
  UpdateChangelogOnPrerelease: false
  FilterByPath:
    - source/

GitHubConfig:
  GitHubFilesToAdd:
    - 'CHANGELOG.md'
  GitHubConfigUserName: YOUR-USERNAME
  GitHubConfigUserEmail: your@email.com
  UpdateChangelogOnPrerelease: false
