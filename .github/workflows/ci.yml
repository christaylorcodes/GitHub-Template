# GitHub Actions CI/CD Pipeline for PowerShell Modules
# Uses Sampler/ModuleBuilder build system
#
# Branch Strategy:
#   - prerelease: Active development, tag vX.Y.Z-label to publish prerelease
#   - main: Stable releases only, tag vX.Y.Z to publish stable
#
# Version is extracted from git tag - no need to update manifest manually.
# Tag format is strict: vX.Y.Z or vX.Y.Z-label (label is alphanumeric only,
# e.g. v1.2.0-beta1, v1.2.0-rc2). Anything else fails the build.
#
# Security note: never interpolate ${{ github.* }} / ${{ needs.* }} values
# directly into a run: script. Pass them through env: instead.

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - prerelease
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'feature/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  MODULE_NAME: ModuleName

jobs:
  # ============================================
  # BUILD JOB
  # ============================================
  build:
    name: Build Module
    runs-on: ubuntu-latest
    outputs:
      module_version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      should_publish: ${{ steps.version.outputs.should_publish }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate Version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
              # Strict: vX.Y.Z or vX.Y.Z-label (alphanumeric label only).
              # PSGallery rejects dotted prerelease labels and Sampler truncates
              # labels at a second dash, so both are refused here.
              if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)(?:-([0-9A-Za-z]+))?$') {
                  throw "Tag '$env:REF_NAME' is not a valid release tag. Use vX.Y.Z or vX.Y.Z-label (e.g. v1.2.0-beta1)."
              }
              $Version = $Matches[1]
              $Label = $Matches[2]
              $SemVer = if ($Label) { "$Version-$Label" } else { $Version }
              $IsPrerelease = if ($Label) { 'true' } else { 'false' }
              $ShouldPublish = 'true'
          } else {
              # Not a tag - use manifest version for build only
              $ManifestPath = Get-ChildItem -Path 'source/*.psd1' | Select-Object -First 1
              if ($ManifestPath) {
                  $Manifest = Import-PowerShellDataFile -Path $ManifestPath.FullName
                  $Version = $Manifest.ModuleVersion
              } else {
                  $Version = '0.0.1'
              }
              $SemVer = $Version
              $IsPrerelease = 'false'
              $ShouldPublish = 'false'
          }

          Write-Host "Version: $Version"
          Write-Host "SemVer: $SemVer"
          Write-Host "Is Prerelease: $IsPrerelease"
          Write-Host "Should Publish: $ShouldPublish"

          "version=$Version" >> $env:GITHUB_OUTPUT
          "semver=$SemVer" >> $env:GITHUB_OUTPUT
          "is_prerelease=$IsPrerelease" >> $env:GITHUB_OUTPUT
          "should_publish=$ShouldPublish" >> $env:GITHUB_OUTPUT

      # Guards against tagging the wrong commit by mistake. This is NOT a
      # security control: a tag push runs the workflow file from the tagged
      # commit, so anyone who can push tags can also edit this check. Use a
      # tag ruleset and environment protection (see docs/PUBLISHING.md).
      - name: Verify Tag Branch
        if: steps.version.outputs.should_publish == 'true'
        shell: pwsh
        env:
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          function Test-OnBranch([string]$Branch) {
              git rev-parse --verify --quiet "refs/remotes/origin/$Branch" *> $null
              if ($LASTEXITCODE -ne 0) { return $false }
              git merge-base --is-ancestor HEAD "origin/$Branch"
              switch ($LASTEXITCODE) {
                  0 { return $true }
                  1 { return $false }
                  default { throw "git merge-base failed (exit $LASTEXITCODE) checking origin/$Branch. Is the checkout shallow?" }
              }
          }

          $Allowed = if ($env:IS_PRERELEASE -eq 'true') { @('main', 'master', 'prerelease') } else { @('main', 'master') }
          $OnBranch = $Allowed | Where-Object { Test-OnBranch $_ } | Select-Object -First 1

          if (-not $OnBranch) {
              throw "Tag '$env:REF_NAME' points at a commit that is not on any of: $($Allowed -join ', '). Refusing to publish."
          }
          Write-Host "Tag '$env:REF_NAME' is on branch '$OnBranch'"

      - name: Resolve Dependencies
        shell: pwsh
        run: |
          ./build.ps1 -ResolveDependency -Tasks noop

      - name: Build Module
        shell: pwsh
        env:
          ModuleVersion: ${{ steps.version.outputs.semver }}
        run: |
          ./build.ps1 -Tasks build

      - name: Verify Built Version Matches Tag
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          $Manifest = Get-ChildItem -Path "output/$env:MODULE_NAME/*/$env:MODULE_NAME.psd1" | Select-Object -First 1
          if (-not $Manifest) { throw "Built manifest not found under output/$env:MODULE_NAME" }

          $Data = Import-PowerShellDataFile -Path $Manifest.FullName
          $Prerelease = "$($Data.PrivateData.PSData.Prerelease)"
          $Built = if ($Prerelease) { "$($Data.ModuleVersion)-$Prerelease" } else { "$($Data.ModuleVersion)" }

          Write-Host "Expected: $env:EXPECTED_SEMVER"
          Write-Host "Built:    $Built"

          if ($Built -ne $env:EXPECTED_SEMVER) {
              throw "Built module version '$Built' does not match expected '$env:EXPECTED_SEMVER'. " +
                  'If a prerelease suffix is missing, ensure PSData contains a Prerelease key in the source manifest.'
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-build
          path: output/${{ env.MODULE_NAME }}
          retention-days: 7

      - name: Upload Required Modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-modules
          path: output/RequiredModules
          retention-days: 1

  # ============================================
  # TEST JOB
  # ============================================
  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Build Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-build
          path: output/${{ env.MODULE_NAME }}

      - name: Download Required Modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: required-modules
          path: output/RequiredModules

      - name: Run Pester Tests
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Resolve-Path output/RequiredModules)" + [IO.Path]::PathSeparator + $env:PSModulePath
          ./build.ps1 -Tasks test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: output/testResults/
          retention-days: 30

  # ============================================
  # ANALYZE JOB
  # ============================================
  analyze:
    name: PSScriptAnalyzer
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Required Modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: required-modules
          path: output/RequiredModules

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Resolve-Path output/RequiredModules)" + [IO.Path]::PathSeparator + $env:PSModulePath
          Import-Module PSScriptAnalyzer

          $SettingsFile = '.PSScriptAnalyzerSettings.psd1'
          # Analyze .ps1/.psm1 only; .psd1 excluded due to PSScriptAnalyzer NullRef bug
          $Files = Get-ChildItem -Path source -Include '*.ps1','*.psm1' -Recurse -File
          $AnalyzerParams = @{}
          if (Test-Path $SettingsFile) {
              $AnalyzerParams.Settings = $SettingsFile
          }

          $Results = $Files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName @AnalyzerParams }

          if ($Results) {
              $Results | Format-Table -AutoSize
              $Errors = $Results | Where-Object Severity -eq 'Error'
              if ($Errors) {
                  throw "PSScriptAnalyzer found $($Errors.Count) error(s)"
              }
          } else {
              Write-Host "No PSScriptAnalyzer issues found"
          }

  # ============================================
  # PUBLISH JOB
  # ============================================
  publish:
    name: Publish to PSGallery
    needs: [build, test, analyze]
    runs-on: ubuntu-latest
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      contents: write  # Required to create GitHub releases
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    # Store PSGALLERY_API_KEY as an *environment* secret on both environments
    # and require reviewers on 'production'. See docs/PUBLISHING.md.
    environment:
      name: ${{ needs.build.outputs.is_prerelease == 'true' && 'prerelease' || 'production' }}
      url: https://www.powershellgallery.com/packages/${{ env.MODULE_NAME }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Build Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-build
          path: output/${{ env.MODULE_NAME }}

      - name: Validate Module
        shell: pwsh
        env:
          EXPECTED_SEMVER: ${{ needs.build.outputs.semver }}
        run: |
          $ModuleDir = Get-ChildItem -Path "output/$env:MODULE_NAME" -Directory |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1
          $ManifestPath = Join-Path $ModuleDir.FullName "$env:MODULE_NAME.psd1"

          Write-Host "Validating: $ManifestPath"
          $Manifest = Test-ModuleManifest -Path $ManifestPath -ErrorAction Stop

          $Prerelease = "$($Manifest.PrivateData.PSData.Prerelease)"
          $Built = if ($Prerelease) { "$($Manifest.Version)-$Prerelease" } else { "$($Manifest.Version)" }

          Write-Host "Module: $($Manifest.Name)"
          Write-Host "Version: $Built"

          if ($Built -ne $env:EXPECTED_SEMVER) {
              throw "Artifact version '$Built' does not match tag version '$env:EXPECTED_SEMVER'"
          }

      - name: Publish to PSGallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          SEMVER: ${{ needs.build.outputs.semver }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
              throw 'PSGALLERY_API_KEY secret is not set for this environment.'
          }

          $ModuleDir = Get-ChildItem -Path "output/$env:MODULE_NAME" -Directory |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1

          # Refuse to silently skip a duplicate version on the first attempt:
          # a duplicate there means two tags built the same version.
          $Existing = Find-PSResource -Name $env:MODULE_NAME -Version $env:SEMVER -Prerelease `
              -Repository PSGallery -ErrorAction SilentlyContinue
          if ($Existing) {
              if ([int]$env:RUN_ATTEMPT -gt 1) {
                  Write-Host "Version $env:SEMVER already on PSGallery (re-run attempt $env:RUN_ATTEMPT) - skipping publish" -ForegroundColor Yellow
                  exit 0
              }
              throw "Version $env:SEMVER of $env:MODULE_NAME is already published to PSGallery."
          }

          Write-Host "Publishing from: $($ModuleDir.FullName)"
          Publish-PSResource -Path $ModuleDir.FullName -ApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -ErrorAction Stop
          Write-Host "Successfully published $env:MODULE_NAME v$env:SEMVER"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ env.MODULE_NAME }} ${{ github.ref_name }}
          body: |
            ## ${{ env.MODULE_NAME }} ${{ needs.build.outputs.semver }}

            Published to [PowerShell Gallery](https://www.powershellgallery.com/packages/${{ env.MODULE_NAME }}/${{ needs.build.outputs.semver }})

            ### Installation
            ```powershell
            Install-PSResource -Name ${{ env.MODULE_NAME }}${{ needs.build.outputs.is_prerelease == 'true' && ' -Prerelease' || '' }}
            ```
          draft: false
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
